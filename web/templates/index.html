<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库KBase v2.0</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
    <div id="tab-bar">
      <span id="tab-scroll-left" class="tab-scroll-btn">&#x2039;</span>
      <div id="tabs"></div>
      <span id="tab-scroll-right" class="tab-scroll-btn">&#x203A;</span>
      <div id="tab-help" title="Help">?</div>
    </div>
  <div id="main-content">
    <div id="sidebar">
      <div id="tree-toolbar">
        <div id="toolbar-dropdown-wrap">
          <button id="btn-toolbar-menu" title="Menu">☰ Menu</button>
          <div id="toolbar-dropdown" style="display:none">
            <div class="dropdown-item" id="dd-collapse-all">全部收起</div>
            <div class="dropdown-item" id="dd-expand-all">全部展开</div>
            <div class="dropdown-sep"></div>
            <div class="dropdown-item" id="dd-add-root">新增 Root Item</div>
          </div>
        </div>
      </div>
      <div id="tree-container"></div>
    </div>
    <div id="splitter"></div>
    <div id="editor-area">
      <div id="editor-toolbar">
        <select id="font-family" title="Font Family">
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Georgia">Georgia</option>
          <option value="Verdana">Verdana</option>
          <option value="SimSun">SimSun (宋体)</option>
          <option value="Microsoft YaHei">Microsoft YaHei</option>
        </select>
        <select id="font-size" title="Font Size">
          <option value="1">Small</option>
          <option value="3">Normal</option>
          <option value="5" selected>Large</option>
          <option value="7">X-Large</option>
        </select>
        <button class="tool-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="tool-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="tool-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <button class="tool-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
        <input type="color" id="text-color" value="#ff0000" title="Text Color">
        <button class="tool-btn" id="btn-insert-link" title="Insert Link">🔗</button>
        <button class="tool-btn" id="btn-insert-image" title="Insert Image">🖼️</button>
        <button class="tool-btn" id="btn-upload-image" title="Upload Image">📤</button>
        <span class="separator"></span>
        <button class="tool-btn" id="btn-paste-plain" title="Paste as Plain Text">📋 Plain</button>
        <span class="separator"></span>
        <label class="search-checkbox-label" title="Search all knowledge bases">
          <input type="checkbox" id="search-global"> 全局搜索
        </label>
        <input type="text" id="search-input" class="search-input" placeholder="输入搜索关键词..." title="Search">
        <button class="tool-btn" id="btn-search" title="Search">🔍 搜索</button>
        <button class="tool-btn" id="btn-save" title="Save Content">💾 Save</button>
        <button class="tool-btn" id="btn-new-tab" title="New Tab">+ Tab</button>
        <div class="kb-selector-wrap">
          <label class="kb-all-checkbox-label" id="kb-all-label" title="全部知识库">
            <input type="checkbox" id="kb-all-checkbox">
            <span class="kb-all-text">全部知识库</span>
          </label>
          <span class="kb-dropdown-arrow" id="kb-dropdown-arrow">▾</span>
          <div id="kb-dropdown" style="display:none"></div>
        </div>
        <span id="indexing-status" style="display:none"></span>
        <input type="file" id="image-upload-input" accept="image/*" style="display:none">
      </div>
      <div id="editor" contenteditable="true">
        <p>Select a menu item to edit its content...</p>
      </div>
      <div id="editor-status">No item selected</div>
    </div>
  </div>
  <div id="search-splitter" style="display:none"></div>
  <div id="search-results-panel" style="display:none">
    <div id="search-results-header">
      <span id="search-results-title">搜索结果</span>
      <span id="search-results-close" title="关闭">✕</span>
    </div>
    <div id="search-results-column-headers" style="display:none">
      <span class="col-tab">知识库<span class="col-resize-handle"></span></span>
      <span class="col-path">路径</span>
      <span class="col-snippet">内容简述<span class="col-resize-handle"></span></span>
    </div>
    <div id="search-results-body"></div>
  </div>
</div>

<!-- Editor Context Menu -->
<div id="context-menu">
  <div class="ctx-item" data-cmd="bold">Bold</div>
  <div class="ctx-item" data-cmd="italic">Italic</div>
  <div class="ctx-item" data-cmd="underline">Underline</div>
  <div class="ctx-item" data-cmd="strikeThrough">Strikethrough</div>
  <div class="ctx-separator"></div>
  <div class="ctx-item" id="ctx-font-family">Font Family</div>
  <div class="ctx-item" id="ctx-font-color">Font Color</div>
  <div class="ctx-item" id="ctx-remove-format">Remove Format</div>
  <div class="ctx-separator"></div>
  <div class="ctx-item" data-cmd="copy">Copy</div>
  <div class="ctx-item" data-cmd="paste">Paste</div>
</div>

<!-- Tree Right-Click Context Menu -->
<div id="tree-context-menu" style="display:none">
  <div class="tree-ctx-item" data-action="add-child">Add Child</div>
  <div class="tree-ctx-item" data-action="add-sibling">Add</div>
  <div class="tree-ctx-sep"></div>
  <div class="tree-ctx-item" data-action="move-up">上移</div>
  <div class="tree-ctx-item" data-action="move-down">下移</div>
  <div class="tree-ctx-item" data-action="move-to">移动到...</div>
  <div class="tree-ctx-sep"></div>
  <div class="tree-ctx-item" data-action="edit">编辑</div>
  <div class="tree-ctx-item" data-action="delete">删除</div>
</div>

<!-- Tab Right-Click Context Menu -->
<div id="tab-context-menu" style="display:none">
  <div class="tab-ctx-item" data-action="edit-tab">编辑</div>
  <div class="tab-ctx-sep"></div>
  <div class="tab-ctx-item" data-action="close-tab">关闭</div>
  <div class="tab-ctx-sep"></div>
  <div class="tab-ctx-item" data-action="delete-tab">删除</div>
</div>

<!-- Dialog Overlay -->
<div id="dialog-overlay" style="display:none">
  <div id="dialog-box">
    <div id="dialog-title"></div>
    <div id="dialog-content"></div>
    <div id="dialog-buttons">
      <button id="dialog-ok">OK</button>
      <button id="dialog-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
